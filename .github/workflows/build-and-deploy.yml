name: Build, test and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build ScheduleRisk.sln -c Release

      - name: Test
        run: dotnet test ScheduleRisk.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Python reference tests
        run: cd reference/python && python3 -m unittest discover -s tests

      - name: Publish web app
        run: dotnet publish src/ScheduleRisk.Web -c Release -o publish

      - name: Prepare for GitHub Pages
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO}/\" />|" publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      # The previous release stays online at /<repo>/v0.3/, built from its release branch.
      - name: Check out release 0.3.0
        uses: actions/checkout@v7
        with:
          ref: release/0.3
          path: previous/v0.3

      - name: Publish release 0.3.0 under v0.3/
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          dotnet publish previous/v0.3/src/ScheduleRisk.Web -c Release -o previous/publish-v0.3
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO}/v0.3/\" />|" previous/publish-v0.3/wwwroot/index.html
          grep -q "<base href=\"/${REPO}/v0.3/\" />" previous/publish-v0.3/wwwroot/index.html
          cp -r previous/publish-v0.3/wwwroot publish/wwwroot/v0.3

      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
