name: PR build and test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build ScheduleRisk.sln -c Release

      - name: Test
        run: dotnet test ScheduleRisk.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Python reference tests
        run: cd reference/python && python3 -m unittest discover -s tests

      - name: Publish web app
        run: dotnet publish src/ScheduleRisk.Web -c Release -o publish

      # The Windows app, so a pull request's .exe can be tried before it is merged.
      - name: Publish the Windows app
        run: >
          dotnet publish src/ScheduleRisk.Desktop -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -o desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectRiskAnalysis-windows
          path: desktop
